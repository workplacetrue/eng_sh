name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.7'
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check english_life tests
      - run: uv run pytest -q
