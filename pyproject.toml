[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "english-life-agent"
version = "0.1.0"
description = "Local English practice tutor for Apple Silicon"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.21,<1", "alembic>=1.16,<2", "pydantic-settings>=2.9,<3"]

[project.optional-dependencies]
voice = ["sounddevice>=0.5,<1", "soundfile>=0.13,<1"]
legacy = ["openai-agents>=0.6,<1", "aiogram>=3.20,<4", "asyncpg>=0.30,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
english-life = "english_life.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["english_life"]
